name: Deploy to Server

on:
  push:
    branches:
      - version_2
  pull_request:
    types:
      - closed
    branches:
      - version_2

jobs:
  deploy:
    # Only run on push or when PR is merged into version_2
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            
            # Navigate to app directory
            cd /home/jahid/price_hun
            
            # Pull latest code from version_2 branch
            git fetch origin version_2
            git checkout version_2
            git pull origin version_2
            
            # Optional: Install/update dependencies
            # Uncomment if needed
            # source venv/bin/activate
            # pip install -r requirements.txt
            
            # Optional: Run migrations (Django)
            # source venv/bin/activate
            # python manage.py/manage.py migrate
            
            sudo systemctl restart gunicorn
            
            echo "✅ Deployment completed successfully"

